name: auto-release

on:
  push:
    tags:
      - "20*.*.*"
      - "20*.*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (CalVer, e.g. 2026.10.20 or 2026.10.20.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: "24"
      - name: Sync package.json version from tag
        if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG}" ]]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "Syncing package.json to version ${TAG}"
          node -e "
          const fs = require('fs');
          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = process.env.TAG;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          " 
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to ${TAG} [skip ci]"
            git push origin HEAD:main
          else
            echo "package.json already at version ${TAG}"
          fi
      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/style-check.js
          node scripts/release-check.js
          node tests/run-tests.js
          node compat/run-compat.js

  publish-release:
    needs:
      - validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve tag
        id: resolve
        shell: bash
        run: |
          input_tag="${{ github.event.inputs.tag }}"
          ref_tag="${GITHUB_REF#refs/tags/}"
          if [[ -n "$input_tag" ]]; then
            echo "tag=$input_tag" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$ref_tag" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        if: ${{ steps.resolve.outputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release for $TAG already exists; leaving it unchanged."
          else
            gh release create "$TAG" --repo "$REPOSITORY" --verify-tag --generate-notes
            echo "Created release for $TAG."
          fi

      - name: Move latest tag to released commit
        if: ${{ steps.resolve.outputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$REPOSITORY/commits/$TAG" -q .sha)"
          ref_name="tags/latest"
          if gh api "repos/$REPOSITORY/git/ref/$ref_name" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$REPOSITORY/git/refs/$ref_name" -f sha="$sha" -F force=true >/dev/null
            echo "Updated refs/$ref_name -> $sha ($TAG)"
          else
            gh api --method POST "repos/$REPOSITORY/git/refs" -f ref="refs/$ref_name" -f sha="$sha" >/dev/null
            echo "Created refs/$ref_name -> $sha ($TAG)"
          fi

      - name: Fail when no tag was resolved
        if: ${{ steps.resolve.outputs.tag == '' }}
        shell: bash
        run: |
          echo "No tag was resolved."
          exit 1
